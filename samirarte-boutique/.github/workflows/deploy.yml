name: Deploy Theme via FTP

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    name: Deploy to webserver via FTP
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: FTP Deploy
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          local-dir: '.'
          protocol: ftps
          # Remove files on remote that do not exist locally
          # Warning: --delete will remove remote files not present in the repo
          git-ftp-args: --insecure --delete
          # Optional: exclude common dev files (pattern list)
          exclude: |
            .git
            .github
            node_modules
            .vscode
            .env

      - name: Confirm deployment
        run: |
          echo "Deployed samirarte-boutique to ${{ secrets.FTP_SERVER }}:${{ secrets.FTP_SERVER_DIR }}"

