name: Deploy Theme via SSH

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    name: Deploy to webserver via rsync/ssh
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Deploy theme to server
        uses: easingthemes/ssh-deploy@v5.1.0
        with:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          REMOTE_HOST: ${{ secrets.REMOTE_HOST }}
          REMOTE_USER: ${{ secrets.REMOTE_USER }}
          REMOTE_PORT: ${{ secrets.REMOTE_PORT }}
          TARGET: ${{ secrets.REMOTE_TARGET }}
          SOURCE: "."
          EXCLUDE: ".git, .github, node_modules, .vscode, .env"
          ARGS: "-rlgoDzvc -i --delete"
          SSH_CMD_ARGS: "-o StrictHostKeyChecking=no"
          SCRIPT_BEFORE: |
            # ensure target exists and has correct permissions
            mkdir -p ${{ secrets.REMOTE_TARGET }}
            chown -R ${{ secrets.REMOTE_USER }}: ${{ secrets.REMOTE_TARGET }} || true
          SCRIPT_AFTER: |
            echo "Deployed samirarte-boutique to ${{ secrets.REMOTE_TARGET }}"
